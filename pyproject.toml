[project]
name = "ragloom"
version = "0.1.0"
description = "A modular Retrieval-Augmented Generation (RAG) backend built with FastAPI"
readme = "README.md"
authors = [
    { name = "Amir Hossni", email = "amiirhosnii548@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "aiofiles>=25.1.0",
    "anthropic>=1.11.0",
    "cohere>=7.2.0",
    "fastapi>=0.141.1",
    "google-genai>=2.28.0",
    "httpx>=0.28.1",
    "langchain>=1.3.18",
    "langchain-core>=1.0.0",
    "langchain-text-splitters>=1.1.2",
    "ollama>=0.6.3",
    "openai>=3.22.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "pymongo>=4.18.1",
    "pymupdf>=1.28.2",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "qdrant-client>=1.19.1",
    "trafilatura>=2.0.0",
    "uvicorn>=0.52.4",
]

[project.scripts]
ragloom = "rag_app:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "rag_app"
